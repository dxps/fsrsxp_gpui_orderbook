# Trunk is only used to BUILD the wasm bundle into `dist/`; the Axum feed
# service (crates/feed) then serves `dist/` alongside /ui-config and /feed,
# so the whole app is one origin and there's no dev-time proxy.
#
# Build:  trunk build            (dev)
#         trunk build --release  (shipped bundle)
# Watch:  trunk watch            (rebuild on file save; reload the browser)

[build]
target  = "index.html"
dist    = "dist"
release = false
