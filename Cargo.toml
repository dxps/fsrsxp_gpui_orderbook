[workspace]
resolver = "2"
members = ["crates/proto", "crates/feed", "crates/ui"]
default-members = ["crates/ui"]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.80"
publish      = false

[workspace.dependencies]
# Shared across crates.
fsrsxp-orderbook-proto = { path = "crates/proto" }
serde                  = { version = "1", features = ["derive"] }
serde_json             = "1"
rand                   = "0.8"

# Dev profile — `opt-level = 1` keeps gpui's layout code tolerable in debug.
[profile.dev]
opt-level = 1

# Release profile tuned for binary size (big win on wasm; also strips the
# native binaries). Kept here so every workspace crate — ui, feed, proto —
# ships the same way.
[profile.release]
lto           = "fat"
codegen-units = 1
opt-level     = "z"
panic         = "abort"
strip         = true
