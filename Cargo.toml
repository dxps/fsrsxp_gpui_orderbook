[package]
name = "fsrsxp_gpui_orderbook"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Trading orderbook dashboard built on GPUI (Zed's UI framework, gpui-pre snapshot)."
publish = false

[[bin]]
name = "orderbook"
path = "src/main.rs"

[dependencies]
gpui          = { package = "gpui-pre",          version = "=0.3.14" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["font-kit", "runtime_shaders"] }
gpui-base     = "=0.11.0"
rand          = "0.8"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
